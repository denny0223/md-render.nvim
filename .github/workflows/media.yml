name: Media tools

# The unit tests check the bytes md-render emits. This job checks that the
# commands it runs still work, against several FFmpeg majors.
#
# It exists because of a silent breakage: FFmpeg 9 removed `-vsync`, frame
# extraction started failing for every video and animated GIF, and nothing
# caught it — the emitted escape sequences were still correct, and no commit
# had touched the code. Hence the schedule: the failure mode is the toolchain
# moving, not the repo changing.
#
# The matrix must span majors rather than track one version. Ubuntu 24.04 still
# ships FFmpeg 6.1, so a job that just runs `apt-get install ffmpeg` would have
# stayed green through the entire incident.

on:
  push:
  pull_request:
  schedule:
    # Mondays 03:00 UTC. Catches toolchain drift with no commit involved.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg-matrix:
    name: ffmpeg ${{ matrix.ffmpeg.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ffmpeg:
          # 6.x and 7.x come from pinned old autobuilds: BtbN drops branches
          # from its rolling `latest` release once they go EOL.
          #
          # These pins expire. BtbN deletes whole autobuild releases, assets
          # and all, keeping roughly the last two weeks of dailies plus a
          # monthly snapshot going back about two years — so an EOL branch
          # survives only as long as the newest snapshot that still carries
          # it. Each URL below is the newest one that does, which is not the
          # same release for both. When one 404s, re-pin it to the newest
          # snapshot whose assets still list that branch:
          #
          #   gh api "repos/BtbN/FFmpeg-Builds/releases?per_page=100" \
          #     -q '.[] | .tag_name + " " +
          #         ([.assets[].name | select(test("linux64-gpl-6\\."))] | join(" "))'
          #
          # The scheduled run is what surfaces the expiry.
          - name: "6.1"
            url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2025-08-31-13-00/ffmpeg-n6.1.3-linux64-gpl-6.1.tar.xz
            sha256: 400f9ca9d8ea3f812660cf7a00b9bfed944175cd9d6bd0c9b6257cf99376a75c
          - name: "7.1"
            url: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-01-31-12-57/ffmpeg-n7.1.3-35-g419cdf9dcc-linux64-gpl-7.1.tar.xz
            sha256: 80e7f0bb40711bb190790f548cb9808f4e4ccfd117a9121e2dbfd74f34368166
          # 8.x, 9.x and master are rolling: the assets are rebuilt in place,
          # so the scheduled run picks up new point releases automatically.
          # This is the part that actually detects drift.
          - name: "8.1"
            url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          - name: "9.0"
            url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          - name: master
            url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable

      - name: Install FFmpeg ${{ matrix.ffmpeg.name }}
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/ffmpeg.tar.xz "${{ matrix.ffmpeg.url }}"
          checksum='${{ matrix.ffmpeg.sha256 }}'
          if [ -n "$checksum" ]; then
            printf '%s  /tmp/ffmpeg.tar.xz\n' "$checksum" | sha256sum --check -
          fi
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          echo "/tmp/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick

      # MD_RENDER_REQUIRE_MEDIA_TOOLS turns "tool missing, skipping" into a
      # failure. Without it a broken install step would look like a pass.
      - name: Run media tests
        env:
          MD_RENDER_REQUIRE_MEDIA_TOOLS: "1"
        run: nvim --headless -u NONE --noplugin -l tests/media_test.lua

  mermaid:
    name: Real Mermaid CLI and browser
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_CACHE_DIR: /tmp/md-render-mermaid-browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.12.0
      - name: Install pinned renderer and its pinned browser revision
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 fonts-liberation imagemagick
          mkdir -p /tmp/md-render-mermaid
          cp tests/fixtures/mermaid-cli/package*.json /tmp/md-render-mermaid/
          npm --prefix /tmp/md-render-mermaid ci --ignore-scripts --no-audit --no-fund
          # Only the locked Puppeteer browser installer needs to run a script.
          node /tmp/md-render-mermaid/node_modules/puppeteer/install.mjs
          # Only this isolated CI fixture needs the hosted runner sandbox override.
          # The plugin's invocation and users' browser configuration stay unchanged.
          mkdir -p /tmp/md-render-mermaid/bin
          printf '%s\n' '{"args":["--no-sandbox"]}' > /tmp/md-render-mermaid/puppeteer.json
          cat > /tmp/md-render-mermaid/bin/mmdc <<'SH'
          #!/bin/sh
          exec /tmp/md-render-mermaid/node_modules/.bin/mmdc \
            -p /tmp/md-render-mermaid/puppeteer.json "$@"
          SH
          chmod +x /tmp/md-render-mermaid/bin/mmdc
          echo /tmp/md-render-mermaid/bin >> "$GITHUB_PATH"
      - name: Report tool versions
        run: |
          node --version
          mmdc --version
          node -e "console.log('puppeteer', require('/tmp/md-render-mermaid/node_modules/puppeteer/package.json').version)"
          browser=$(node -e "require('/tmp/md-render-mermaid/node_modules/puppeteer').executablePath().then(console.log)")
          "$browser" --version
      - name: Render through the plugin from a cold cache
        run: nvim --headless -u NONE --noplugin -l tests/mermaid_integration.lua

  # The scheduled run is only meaningful if someone hears about it. A failing
  # cron job on a repo nobody is watching is the same as no test at all.
  notify:
    name: Open an issue on scheduled failure
    needs: [ffmpeg-matrix, mermaid]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "Scheduled media-tool test failed";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "toolchain",
            });
            const existing = open.find(i => i.title === title);
            const body = `The weekly media-tool checks failed. An external tool most likely changed under us.\n\n${url}`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["toolchain"] });
            }
