name: Media tools

# Representative gates stay fixed; weekly observations track external drift.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Fixed baseline or weekly toolchain observation
        type: choice
        options: [baseline, observation]
        default: baseline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUITE: ${{ (github.event_name == 'schedule' || inputs.suite == 'observation') && 'observation' || 'baseline' }}

jobs:
  ffmpeg-matrix:
    name: FFmpeg conversions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/md-render-media-results"
      - name: Cache verified Neovim archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/md-render-cache/neovim
          key: neovim-archives-v1-${{ runner.os }}-${{ runner.arch }}-v0.12.0-${{ hashFiles('.github/ci/neovim-archives.tsv') }}
      - name: Install minimum Neovim
        id: nvim
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-neovim.sh v0.12.0
      - name: Install ImageMagick
        id: media_tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          nvim --version
          convert -version
      - name: Cache fixed archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/md-render-ffmpeg-archives
          key: ffmpeg-linux-x64-${{ env.SUITE }}-${{ hashFiles('.github/ci/ffmpeg-archives.tsv') }}
      - name: Install FFmpeg 6.1
        id: install_6
        if: ${{ !cancelled() && steps.nvim.outcome == 'success' && steps.media_tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-ffmpeg.sh 6.1 "$SUITE"
      - name: Test FFmpeg 6.1 from cold conversion cache
        id: test_6
        if: ${{ !cancelled() && steps.install_6.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          MD_RENDER_REQUIRE_MEDIA_TOOLS: "1"
        run: |
          set -o pipefail
          PATH="$RUNNER_TEMP/md-render-ffmpeg/6.1/bin:$PATH" nvim --headless -u NONE --noplugin -l tests/media_test.lua 2>&1 | tee "$RUNNER_TEMP/md-render-media-results/ffmpeg-6.1-test.log"
      - name: Install FFmpeg 7.1
        id: install_7
        if: ${{ !cancelled() && env.SUITE == 'observation' && steps.nvim.outcome == 'success' && steps.media_tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-ffmpeg.sh 7.1 "$SUITE"
      - name: Test FFmpeg 7.1 from cold conversion cache
        id: test_7
        if: ${{ !cancelled() && steps.install_7.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          MD_RENDER_REQUIRE_MEDIA_TOOLS: "1"
        run: |
          set -o pipefail
          PATH="$RUNNER_TEMP/md-render-ffmpeg/7.1/bin:$PATH" nvim --headless -u NONE --noplugin -l tests/media_test.lua 2>&1 | tee "$RUNNER_TEMP/md-render-media-results/ffmpeg-7.1-test.log"
      - name: Install FFmpeg 8.1
        id: install_8
        if: ${{ !cancelled() && env.SUITE == 'observation' && steps.nvim.outcome == 'success' && steps.media_tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-ffmpeg.sh 8.1 "$SUITE"
      - name: Test FFmpeg 8.1 from cold conversion cache
        id: test_8
        if: ${{ !cancelled() && steps.install_8.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          MD_RENDER_REQUIRE_MEDIA_TOOLS: "1"
        run: |
          set -o pipefail
          PATH="$RUNNER_TEMP/md-render-ffmpeg/8.1/bin:$PATH" nvim --headless -u NONE --noplugin -l tests/media_test.lua 2>&1 | tee "$RUNNER_TEMP/md-render-media-results/ffmpeg-8.1-test.log"
      - name: Install FFmpeg 9.0
        id: install_9
        if: ${{ !cancelled() && steps.nvim.outcome == 'success' && steps.media_tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-ffmpeg.sh 9.0 "$SUITE"
      - name: Test FFmpeg 9.0 from cold conversion cache
        id: test_9
        if: ${{ !cancelled() && steps.install_9.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          MD_RENDER_REQUIRE_MEDIA_TOOLS: "1"
        run: |
          set -o pipefail
          PATH="$RUNNER_TEMP/md-render-ffmpeg/9.0/bin:$PATH" nvim --headless -u NONE --noplugin -l tests/media_test.lua 2>&1 | tee "$RUNNER_TEMP/md-render-media-results/ffmpeg-9.0-test.log"
      - name: Install FFmpeg master
        id: install_master
        if: ${{ !cancelled() && env.SUITE == 'observation' && steps.nvim.outcome == 'success' && steps.media_tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-ffmpeg.sh master "$SUITE"
      - name: Test FFmpeg master from cold conversion cache
        id: test_master
        if: ${{ !cancelled() && steps.install_master.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          MD_RENDER_REQUIRE_MEDIA_TOOLS: "1"
        run: |
          set -o pipefail
          PATH="$RUNNER_TEMP/md-render-ffmpeg/master/bin:$PATH" nvim --headless -u NONE --noplugin -l tests/media_test.lua 2>&1 | tee "$RUNNER_TEMP/md-render-media-results/ffmpeg-master-test.log"
      - name: Summarize every selected FFmpeg version
        id: phases
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          steps = json.loads(os.environ['STEPS_JSON'])
          versions = ['6', '7', '8', '9', 'master'] if os.environ['SUITE'] == 'observation' else ['6', '9']
          required = ['nvim', 'media_tools'] + [f'{phase}_{v}' for v in versions for phase in ['install', 'test']]
          rows = {name: steps.get(name, {}).get('outcome', 'not-run') for name in required}
          text = '## FFmpeg ' + os.environ['SUITE'] + '\n\n' + '\n'.join(f'- {name}: {value}' for name, value in rows.items()) + '\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(text)
          results = pathlib.Path(os.environ['RUNNER_TEMP']) / 'md-render-media-results'
          results.mkdir(exist_ok=True)
          (results / 'outcomes.json').write_text(json.dumps(rows, indent=2) + '\n')
          failed = ','.join(name for name, value in rows.items() if value != 'success') or 'none'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('failed=' + failed + '\n')
          PY
      - name: Require original phases / ${{ steps.phases.outputs.failed || 'summary incomplete' }}
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.phases.outcome }}
          FAILED_PHASES: ${{ steps.phases.outputs.failed }}
        run: |
          test "$SUMMARY_OUTCOME" = success
          test "$FAILED_PHASES" = none
      - name: Retain FFmpeg evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-${{ env.SUITE }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/md-render-media-results
            ${{ runner.temp }}/md-render-neovim-results
          if-no-files-found: warn
          retention-days: ${{ job.status != 'success' && (env.SUITE == 'observation' && 90 || 30) || 14 }}

  mermaid:
    name: Mermaid ${{ matrix.renderer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        renderer: ${{ (github.event_name == 'schedule' || inputs.suite == 'observation') && fromJSON('["pinned", "latest"]') || fromJSON('["pinned"]') }}
    defaults:
      run:
        shell: bash
    env:
      PUPPETEER_CACHE_DIR: /tmp/md-render-mermaid-browser
      MD_RENDER_REQUIRE_MERMAID_TOOLS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/md-render-media-results"
      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Cache verified Neovim archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/md-render-cache/neovim
          key: neovim-archives-v1-${{ runner.os }}-${{ runner.arch }}-v0.12.0-${{ hashFiles('.github/ci/neovim-archives.tsv') }}
      - name: Install minimum Neovim
        id: nvim
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-neovim.sh v0.12.0
      - name: Install browser libraries and PNG decoder
        id: browser_tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 fonts-liberation imagemagick
      - name: Resolve renderer and install its matching browser
        id: renderer
        if: ${{ !cancelled() && steps.node.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          RENDERER: ${{ matrix.renderer }}
        run: |
          mkdir -p /tmp/md-render-mermaid
          if [ "$RENDERER" = pinned ]; then
            cp tests/fixtures/mermaid-cli/package*.json /tmp/md-render-mermaid/
          else
            printf '%s\n' '{"name":"md-render-mermaid-observation","private":true}' > /tmp/md-render-mermaid/package.json
            npm --prefix /tmp/md-render-mermaid install --package-lock-only --ignore-scripts --no-audit --no-fund @mermaid-js/mermaid-cli@latest
          fi
          cp /tmp/md-render-mermaid/package*.json "$RUNNER_TEMP/md-render-media-results/"
          npm --prefix /tmp/md-render-mermaid ci --ignore-scripts --no-audit --no-fund
          # Resolve Puppeteer from the CLI, including a nested dependency when versions differ.
          puppeteer_package=$(node -e "const req=require('node:module').createRequire('/tmp/md-render-mermaid/node_modules/@mermaid-js/mermaid-cli/package.json'); console.log(req.resolve('puppeteer/package.json'))")
          node "$(dirname "$puppeteer_package")/install.mjs"
          mkdir -p /tmp/md-render-mermaid/bin
          printf '%s\n' '{"args":["--no-sandbox"]}' > /tmp/md-render-mermaid/puppeteer.json
          cat > /tmp/md-render-mermaid/bin/mmdc <<'SH'
          #!/bin/sh
          exec /tmp/md-render-mermaid/node_modules/.bin/mmdc \
            -p /tmp/md-render-mermaid/puppeteer.json "$@"
          SH
          chmod +x /tmp/md-render-mermaid/bin/mmdc
          echo /tmp/md-render-mermaid/bin >> "$GITHUB_PATH"
      - name: Require and report actual tool identities
        id: identities
        if: ${{ !cancelled() && steps.renderer.outcome == 'success' && steps.nvim.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -o pipefail
          {
            for tool in node npm nvim mmdc convert; do command -v "$tool"; done
            node --version
            npm --version
            nvim --version
            mmdc --version
            convert -version
            node - <<'JS'
          (async () => {
            const req = require('node:module').createRequire('/tmp/md-render-mermaid/node_modules/@mermaid-js/mermaid-cli/package.json');
            const browser = await req('puppeteer').executablePath();
            console.log('puppeteer', req('puppeteer/package.json').version);
            console.log('browser', browser);
            const version = require('node:child_process').execFileSync(browser, ['--version'], { encoding: 'utf8' });
            console.log(version.trim());
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
            sha256sum /tmp/md-render-mermaid/package-lock.json
          } 2>&1 | tee "$RUNNER_TEMP/md-render-media-results/tool-identities.txt"
      - name: Render real PNG from cold cache
        id: png
        if: ${{ !cancelled() && steps.identities.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          nvim --headless -u NONE --noplugin -l tests/mermaid_integration.lua 2>&1 | tee "$RUNNER_TEMP/md-render-media-results/mermaid-png.log"
      - name: Check Puppeteer configuration isolation
        id: security
        if: ${{ !cancelled() && steps.identities.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          nvim --headless -u NONE --noplugin -l tests/mermaid_security_integration.lua 2>&1 | tee "$RUNNER_TEMP/md-render-media-results/mermaid-security.log"
      - name: Summarize both Mermaid checks
        id: phases
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          RENDERER: ${{ matrix.renderer }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          steps = json.loads(os.environ['STEPS_JSON'])
          required = ['node', 'nvim', 'browser_tools', 'renderer', 'identities', 'png', 'security']
          rows = {name: steps.get(name, {}).get('outcome', 'not-run') for name in required}
          text = '## Mermaid ' + os.environ['RENDERER'] + '\n\n' + '\n'.join(f'- {name}: {value}' for name, value in rows.items()) + '\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(text)
          results = pathlib.Path(os.environ['RUNNER_TEMP']) / 'md-render-media-results'
          results.mkdir(exist_ok=True)
          (results / 'outcomes.json').write_text(json.dumps(rows, indent=2) + '\n')
          failed = ','.join(name for name, value in rows.items() if value != 'success') or 'none'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('failed=' + failed + '\n')
          PY
      - name: Require original phases / ${{ steps.phases.outputs.failed || 'summary incomplete' }}
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.phases.outcome }}
          FAILED_PHASES: ${{ steps.phases.outputs.failed }}
        run: |
          test "$SUMMARY_OUTCOME" = success
          test "$FAILED_PHASES" = none
      - name: Retain Mermaid evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mermaid-${{ matrix.renderer }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/md-render-media-results
            ${{ runner.temp }}/md-render-neovim-results
          if-no-files-found: warn
          retention-days: ${{ job.status != 'success' && (env.SUITE == 'observation' && 90 || 30) || 14 }}

  notify:
    name: Report weekly observation
    needs: [ffmpeg-matrix, mermaid]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'observation')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/ci/notify.js')({
              github, context, core, needs: JSON.parse(process.env.CI_NEEDS), dryRun: false,
            });

  preview:
    name: Preview CI report
    needs: [ffmpeg-matrix, mermaid]
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/ci/notify.js')({
              github, context, core, needs: JSON.parse(process.env.CI_NEEDS),
            });
