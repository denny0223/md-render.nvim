name: Terminal

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 11:57 in Taiwan, after the core and media observations.
    - cron: "57 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        type: choice
        options: [baseline, observation]
        default: baseline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kitty-matrix:
    name: kitty ${{ matrix.kitty }} / nvim ${{ matrix.nvim }} (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Share dependencies and direct-Kitty checks across the two weekly tmux
      # versions. Each tmux still has independent installation and test outcomes.
      matrix: ${{ fromJSON((github.event_name == 'schedule' || inputs.suite == 'observation') && '{"include":[{"lane":"minimum","kitty":"0.40.0","nvim":"v0.12.0"},{"lane":"stable","kitty":"0.40.0","nvim":"stable"},{"lane":"nightly","kitty":"0.40.0","nvim":"nightly"},{"lane":"minimum","kitty":"latest","nvim":"v0.12.0"},{"lane":"stable","kitty":"latest","nvim":"stable"},{"lane":"nightly","kitty":"latest","nvim":"nightly"}]}' || '{"include":[{"lane":"minimum","kitty":"0.40.0","nvim":"v0.12.0"},{"lane":"current","kitty":"0.49.2","nvim":"v0.12.5"}]}') }}
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      OBSERVATION: ${{ github.event_name == 'schedule' || inputs.suite == 'observation' }}
      IMAGES_REQUIRED: ${{ !(github.event_name == 'schedule' || inputs.suite == 'observation') || (matrix.kitty == 'latest' && matrix.nvim == 'v0.12.0') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          persist-credentials: false

      - name: Prepare diagnostics
        id: diagnostics
        run: mkdir -p "$RUNNER_TEMP/md-terminal-results"

      - name: Restore fixed Neovim archives
        if: matrix.nvim != 'stable' && matrix.nvim != 'nightly'
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/md-render-cache/neovim
          key: neovim-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.nvim }}-${{ hashFiles('.github/ci/neovim-archives.tsv') }}

      - name: Install verified Neovim
        id: nvim
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          NVIM_VERSION: ${{ matrix.nvim }}
        run: bash .github/ci/install-neovim.sh "$NVIM_VERSION"

      - name: Install Xvfb, graphics, image and build dependencies
        id: dependencies
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick libevent-dev libncurses-dev libgl1-mesa-dri \
            fontconfig fonts-dejavu-core fonts-noto-cjk fonts-noto-mono \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon-x11-0 libdbus-1-3 \
            python3-pil python3-gi python3-gi-cairo python3-cairo gir1.2-pango-1.0 \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/dependencies.log"

      - name: Restore verified fixed archives
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/terminal-archives
          key: terminal-archives-${{ runner.os }}-x64-${{ matrix.kitty }}-${{ env.OBSERVATION }}-${{ hashFiles('.github/ci/install-terminal.sh') }}

      - name: Install Kitty ${{ matrix.kitty }}
        id: kitty
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KITTY_VERSION: ${{ matrix.kitty }}
        run: |
          set -euo pipefail
          bash .github/ci/install-terminal.sh kitty "$KITTY_VERSION" \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/install-kitty.log"

      - name: Install tmux 3.4 (weekly fallback)
        id: tmux34
        if: ${{ !cancelled() && env.OBSERVATION == 'true' && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash .github/ci/install-terminal.sh tmux 3.4 \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/install-tmux-3.4.log"

      - name: Run direct Kitty checks once
        id: direct
        if: ${{ !cancelled() && steps.nvim.outcome == 'success' && steps.kitty.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          KITTY_BIN: ${{ steps.kitty.outputs.bin }}
        run: |
          set -euo pipefail
          export PATH="$KITTY_BIN:$PATH"
          test "$(command -v kitty)" = "$KITTY_BIN/kitty"
          kitty --version
          nvim --version | head -1
          python3 tests/terminal_test.py 2>&1 | tee "$RUNNER_TEMP/md-terminal-results/direct.log"

      - name: Run tmux 3.4 plain fallback (on and all)
        id: native34
        if: ${{ !cancelled() && env.OBSERVATION == 'true' && steps.nvim.outcome == 'success' && steps.kitty.outcome == 'success' && steps.tmux34.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          KITTY_BIN: ${{ steps.kitty.outputs.bin }}
          TMUX_BIN: ${{ steps.tmux34.outputs.bin }}
        run: |
          set -euo pipefail
          export PATH="$TMUX_BIN:$KITTY_BIN:$PATH"
          test "$(command -v tmux)" = "$TMUX_BIN/tmux"
          test "$(tmux -V)" = 'tmux 3.4'
          result=0
          for passthrough in on all; do
            xvfb-run -a --server-args="-screen 0 2400x1800x24" \
              python3 tests/tmux_terminal_test.py --expect-plain --passthrough "$passthrough" \
              --output-on-failure "$RUNNER_TEMP/md-terminal-results/tmux-3.4/native-$passthrough" \
              2>&1 | tee "$RUNNER_TEMP/md-terminal-results/native-3.4-$passthrough.log" || result=$?
          done
          exit "$result"

      - name: Install tmux 3.6
        id: tmux36
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash .github/ci/install-terminal.sh tmux 3.6 \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/install-tmux-3.6.log"

      - name: Run tmux 3.6 native headings (on and all)
        id: native36
        if: ${{ !cancelled() && steps.nvim.outcome == 'success' && steps.kitty.outcome == 'success' && steps.tmux36.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          KITTY_BIN: ${{ steps.kitty.outputs.bin }}
          TMUX_BIN: ${{ steps.tmux36.outputs.bin }}
        run: |
          set -euo pipefail
          export PATH="$TMUX_BIN:$KITTY_BIN:$PATH"
          test "$(command -v tmux)" = "$TMUX_BIN/tmux"
          test "$(tmux -V)" = 'tmux 3.6'
          result=0
          for passthrough in on all; do
            xvfb-run -a --server-args="-screen 0 2400x1800x24" \
              python3 tests/tmux_terminal_test.py --passthrough "$passthrough" \
              --output-on-failure "$RUNNER_TEMP/md-terminal-results/tmux-3.6/native-$passthrough" \
              2>&1 | tee "$RUNNER_TEMP/md-terminal-results/native-3.6-$passthrough.log" || result=$?
          done
          exit "$result"

      - name: Check image pixels and interactions independently of native results
        id: images
        if: ${{ !cancelled() && env.IMAGES_REQUIRED == 'true' && steps.nvim.outcome == 'success' && steps.kitty.outcome == 'success' && steps.tmux36.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          KITTY_BIN: ${{ steps.kitty.outputs.bin }}
          TMUX_BIN: ${{ steps.tmux36.outputs.bin }}
        run: |
          set -euo pipefail
          export PATH="$TMUX_BIN:$KITTY_BIN:$PATH"
          test "$(command -v tmux)" = "$TMUX_BIN/tmux"
          test "$(tmux -V)" = 'tmux 3.6'
          xvfb-run -a --server-args="-screen 0 2400x1800x24" \
            python3 tests/tmux_terminal_test.py --images --passthrough all \
            --output "$RUNNER_TEMP/md-terminal-results/tmux-3.6/images" \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/images.log"

      - name: Summarize every required outcome and retain failure
        id: phases
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          steps = json.loads(os.environ["STEP_RESULTS"])
          required = ["checkout", "diagnostics", "nvim", "dependencies", "kitty", "direct", "tmux36", "native36"]
          if os.environ["OBSERVATION"] == "true":
              required += ["tmux34", "native34"]
          if os.environ["IMAGES_REQUIRED"] == "true":
              required += ["images"]
          outcomes = {name: steps.get(name, {}).get("outcome", "not run") for name in required}
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "md-terminal-results"
          root.mkdir(parents=True, exist_ok=True)
          (root / "outcomes.json").write_text(json.dumps(outcomes, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| Required terminal phase | Original outcome |\n| --- | --- |\n")
              for name, outcome in outcomes.items():
                  summary.write(f"| {name} | {outcome} |\n")
              if any(value not in ("success", "failure") for value in outcomes.values()):
                  summary.write("\nIncomplete: at least one required phase did not finish. Artifact upload is best effort after cancellation or a job timeout.\n")
          failed = ','.join(name for name, outcome in outcomes.items() if outcome != 'success') or 'none'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('failed=' + failed + '\n')
          PY

      - name: Require original phases / ${{ steps.phases.outputs.failed || 'summary incomplete' }}
        id: result
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.phases.outcome }}
          FAILED_PHASES: ${{ steps.phases.outputs.failed }}
        run: |
          test "$SUMMARY_OUTCOME" = success
          test "$FAILED_PHASES" = none

      - name: Keep terminal diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminal-kitty-${{ matrix.kitty }}-nvim-${{ matrix.nvim }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/md-terminal-results
            ${{ runner.temp }}/md-render-neovim-results
          retention-days: ${{ steps.result.outcome == 'success' && 14 || ((github.event_name == 'schedule' || inputs.suite == 'observation') && 90 || 30) }}

  notify:
    name: Report weekly observation
    needs: [kitty-matrix]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'observation')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/ci/notify.js')({
              github, context, core, needs: JSON.parse(process.env.CI_NEEDS), dryRun: false,
            });

  preview:
    name: Preview CI report
    needs: [kitty-matrix]
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/ci/notify.js')({
              github, context, core, needs: JSON.parse(process.env.CI_NEEDS),
            });
