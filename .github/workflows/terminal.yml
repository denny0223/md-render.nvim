name: Terminal

# Drives a real Kitty under Xvfb and asserts on what the terminal actually
# holds, using `kitty @ get-text --ansi` — which round-trips OSC 66 verbatim,
# so "is this heading drawn at double size" is an exact string match rather
# than a screenshot comparison.
#
# This is the layer between the unit tests (the bytes md-render emits) and the
# visual regression tests (pixels, macOS-local only). It explicitly selects
# native OSC 66, checks all six sizes and plain Markdown ranks, and verifies
# Heading margins retain scaling; text entry reveals accurate cursor feedback.
# The driver clears inherited terminal/tmux hints and uses isolated configs.
#
# Same shape as the FFmpeg matrix: a pinned floor plus a version that follows
# upstream, so both "we broke the oldest supported setup" and "upstream moved
# under us" are visible. The schedule is for the second kind, which no push
# would ever trigger.

on:
  push:
  pull_request:
  schedule:
    # Mondays 03:30 UTC, half an hour after the media matrix.
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kitty-matrix:
    name: kitty ${{ matrix.kitty }} / tmux ${{ matrix.tmux }} / nvim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.40.0 introduced the text sizing protocol, so it is the floor this
        # feature can possibly work on. `latest` is resolved at run time.
        kitty: ["0.40.0", "latest"]
        # 3.6 added popup focus events; older servers must keep ordinary text.
        tmux: ["3.4", "3.6"]
        # v0.12.0 is the declared minimum and differs from stable in ways that
        # matter here; nightly is the early warning.
        nvim: [v0.12.0, nightly]
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # Kitty is dynamically linked against the usual X client libraries and
      # dlopens its GLFW backend, so a missing one is a startup failure rather
      # than a link error: without libXcursor it dies with
      #   Failed to dlopen .../kitty.glfw-x11.so: libXcursor.so.1: cannot open
      # It also needs fontconfig and at least one font, and Noto CJK covers the
      # CJK heading in the fixture. Ubuntu's own kitty package is 0.32, far
      # below the 0.40 the text sizing protocol needs, so take the tarball.
      - name: Install Kitty ${{ matrix.kitty }} and Xvfb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb imagemagick libevent-dev libncurses-dev libgl1-mesa-dri xauth fontconfig fonts-dejavu-core fonts-noto-cjk \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon-x11-0 libdbus-1-3
          version='${{ matrix.kitty }}'
          if [ "$version" = latest ]; then
            version="$(gh api repos/kovidgoyal/kitty/releases/latest --jq '.tag_name | ltrimstr("v")')"
          fi
          echo "Using kitty $version"
          curl -fsSL -o /tmp/kitty.txz \
            "https://github.com/kovidgoyal/kitty/releases/download/v${version}/kitty-${version}-x86_64.txz"
          if [ '${{ matrix.kitty }}' != latest ]; then
            echo '041c6fedd9be2f257d64eee41099a19f1ea525c69214ded5e930ff96ccb6b8a4  /tmp/kitty.txz' | sha256sum --check -
          fi
          sudo mkdir -p /opt/kitty
          sudo tar -xJf /tmp/kitty.txz -C /opt/kitty
          echo "/opt/kitty/bin" >> "$GITHUB_PATH"

      - name: Install tmux ${{ matrix.tmux }}
        run: |
          set -euxo pipefail
          version='${{ matrix.tmux }}'
          curl -fsSL -o /tmp/tmux.tar.gz \
            "https://github.com/tmux/tmux/releases/download/${version}/tmux-${version}.tar.gz"
          case "$version" in
            3.4) checksum=551ab8dea0bf505c0ad6b7bb35ef567cdde0ccb84357df142c254f35a23e19aa ;;
            3.6) checksum=136db80cfbfba617a103401f52874e7c64927986b65b1b700350b6058ad69607 ;;
            *) echo "Missing tmux checksum for $version" >&2; exit 1 ;;
          esac
          printf '%s  /tmp/tmux.tar.gz\n' "$checksum" | sha256sum --check -
          tar -xzf /tmp/tmux.tar.gz -C /tmp
          cd "/tmp/tmux-${version}"
          ./configure --prefix=/opt/tmux
          make -j2
          sudo make install
          echo "/opt/tmux/bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: |
          kitty --version
          tmux -V
          nvim --version | head -1

      - name: Run terminal tests
        run: python3 tests/terminal_test.py

      - name: Run native headings through tmux
        run: |
          args=()
          if [ '${{ matrix.tmux }}' = 3.4 ]; then args+=(--expect-plain); fi
          result=0
          for passthrough in on all; do
            xvfb-run -a --server-args="-screen 0 2400x1800x24" \
              python3 tests/tmux_terminal_test.py --passthrough "$passthrough" "${args[@]}" \
              --output-on-failure "/tmp/md-terminal-results/native-$passthrough" || result=$?
          done
          exit "$result"

      # One supported combination exercises the full raster-to-terminal path;
      # the rest of the matrix retains its smaller native/fallback checks.
      - name: Install image heading dependencies
        if: matrix.kitty == 'latest' && matrix.tmux == '3.6' && matrix.nvim == 'v0.12.0'
        run: >-
          sudo apt-get install -y --no-install-recommends python3-pil
          python3-gi python3-gi-cairo python3-cairo gir1.2-pango-1.0 fonts-noto-mono

      - name: Check image heading pixels and interactions
        if: matrix.kitty == 'latest' && matrix.tmux == '3.6' && matrix.nvim == 'v0.12.0'
        run: >-
          xvfb-run -a --server-args="-screen 0 2400x1800x24"
          python3 tests/tmux_terminal_test.py --images --passthrough all
          --output /tmp/md-terminal-results/images

      - name: Keep terminal diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminal-kitty-${{ matrix.kitty }}-tmux-${{ matrix.tmux }}-nvim-${{ matrix.nvim }}-attempt-${{ github.run_attempt }}
          path: /tmp/md-terminal-results

  notify:
    name: Open an issue on scheduled failure
    needs: kitty-matrix
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "Scheduled terminal test failed";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "toolchain",
            });
            const existing = open.find(i => i.title === title);
            const body = `The weekly Kitty matrix failed. The terminal or Neovim most likely changed under us.\n\n${url}`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["toolchain"] });
            }
