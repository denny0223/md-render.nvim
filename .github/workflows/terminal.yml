name: Terminal

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 11:57 in Taiwan, after the core and media observations.
    - cron: "57 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        type: choice
        options: [baseline, observation]
        default: baseline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kitty-matrix:
    name: kitty ${{ matrix.kitty }} / nvim ${{ matrix.nvim }} (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Share dependencies and direct-Kitty checks across selected tmux versions.
      # Each tmux still has independent installation and test outcomes.
      matrix: ${{ fromJSON((github.event_name == 'schedule' || inputs.suite == 'observation') && '{"include":[{"lane":"minimum","kitty":"0.40.0","nvim":"v0.12.0"},{"lane":"stable","kitty":"0.40.0","nvim":"stable"},{"lane":"nightly","kitty":"0.40.0","nvim":"nightly"},{"lane":"minimum","kitty":"latest","nvim":"v0.12.0"},{"lane":"stable","kitty":"latest","nvim":"stable"},{"lane":"nightly","kitty":"latest","nvim":"nightly"}]}' || '{"include":[{"lane":"minimum","kitty":"0.40.0","nvim":"v0.12.0"},{"lane":"reference","kitty":"0.49.2","nvim":"v0.12.5"}]}') }}
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      OBSERVATION: ${{ github.event_name == 'schedule' || inputs.suite == 'observation' }}
      TMUX34_REQUIRED: ${{ (github.event_name == 'schedule' || inputs.suite == 'observation') && ((matrix.kitty == '0.40.0' && matrix.nvim == 'v0.12.0') || (matrix.kitty == 'latest' && matrix.nvim == 'nightly')) }}
      IMAGES_REQUIRED: ${{ !(github.event_name == 'schedule' || inputs.suite == 'observation') || (matrix.kitty == 'latest' && matrix.nvim == 'v0.12.0') }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false

      - name: Prepare diagnostics
        id: diagnostics
        run: mkdir -p "$RUNNER_TEMP/md-terminal-results"

      - name: Restore fixed Neovim archives
        if: matrix.nvim != 'stable' && matrix.nvim != 'nightly'
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/md-render-cache/neovim
          key: neovim-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.nvim }}-${{ hashFiles('.github/ci/neovim-archives.tsv') }}

      - name: Install verified Neovim
        id: nvim
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          NVIM_VERSION: ${{ matrix.nvim }}
        run: bash .github/ci/install-neovim.sh "$NVIM_VERSION"

      - name: Install Xvfb, graphics, image and build dependencies
        id: dependencies
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth imagemagick libevent-dev libncurses-dev libgl1-mesa-dri \
            fontconfig fonts-dejavu-core fonts-noto-cjk fonts-noto-mono \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon-x11-0 libdbus-1-3 \
            python3-pil python3-gi python3-gi-cairo python3-cairo gir1.2-pango-1.0 \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/dependencies.log"

      - name: Restore verified fixed archives
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/terminal-archives
          key: terminal-archives-${{ runner.os }}-x64-${{ matrix.kitty }}-${{ env.OBSERVATION }}-${{ hashFiles('.github/ci/install-terminal.sh') }}

      - name: Install Kitty ${{ matrix.kitty }}
        id: kitty
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KITTY_VERSION: ${{ matrix.kitty }}
        run: |
          set -euo pipefail
          bash .github/ci/install-terminal.sh kitty "$KITTY_VERSION" \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/install-kitty.log"

      - name: Install tmux 3.4 (weekly fallback)
        id: tmux34
        if: ${{ !cancelled() && env.TMUX34_REQUIRED == 'true' && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash .github/ci/install-terminal.sh tmux 3.4 \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/install-tmux-3.4.log"

      - name: Run direct Kitty checks once
        id: direct
        if: ${{ !cancelled() && steps.nvim.outcome == 'success' && steps.kitty.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          KITTY_BIN: ${{ steps.kitty.outputs.bin }}
        run: |
          set -euo pipefail
          export PATH="$KITTY_BIN:$PATH"
          test "$(command -v kitty)" = "$KITTY_BIN/kitty"
          kitty --version
          nvim --version | head -1
          python3 tests/terminal_test.py 2>&1 | tee "$RUNNER_TEMP/md-terminal-results/direct.log"

      - name: Run tmux 3.4 plain fallback (on and all)
        id: native34
        if: ${{ !cancelled() && env.TMUX34_REQUIRED == 'true' && steps.nvim.outcome == 'success' && steps.kitty.outcome == 'success' && steps.tmux34.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          KITTY_BIN: ${{ steps.kitty.outputs.bin }}
          TMUX_BIN: ${{ steps.tmux34.outputs.bin }}
        run: |
          set -euo pipefail
          export PATH="$TMUX_BIN:$KITTY_BIN:$PATH"
          test "$(command -v tmux)" = "$TMUX_BIN/tmux"
          test "$(tmux -V)" = 'tmux 3.4'
          result=0
          for passthrough in on all; do
            xvfb-run -a --server-args="-screen 0 2400x1800x24" \
              python3 tests/tmux_terminal_test.py --expect-plain --passthrough "$passthrough" \
              --output-on-failure "$RUNNER_TEMP/md-terminal-results/tmux-3.4/native-$passthrough" \
              2>&1 | tee "$RUNNER_TEMP/md-terminal-results/native-3.4-$passthrough.log" || result=$?
          done
          exit "$result"

      - name: Install tmux 3.6
        id: tmux36
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash .github/ci/install-terminal.sh tmux 3.6 \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/install-tmux-3.6.log"

      - name: Run tmux 3.6 native headings (on and all)
        id: native36
        if: ${{ !cancelled() && steps.nvim.outcome == 'success' && steps.kitty.outcome == 'success' && steps.tmux36.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          KITTY_BIN: ${{ steps.kitty.outputs.bin }}
          TMUX_BIN: ${{ steps.tmux36.outputs.bin }}
        run: |
          set -euo pipefail
          export PATH="$TMUX_BIN:$KITTY_BIN:$PATH"
          test "$(command -v tmux)" = "$TMUX_BIN/tmux"
          test "$(tmux -V)" = 'tmux 3.6'
          result=0
          for passthrough in on all; do
            xvfb-run -a --server-args="-screen 0 2400x1800x24" \
              python3 tests/tmux_terminal_test.py --passthrough "$passthrough" \
              --output-on-failure "$RUNNER_TEMP/md-terminal-results/tmux-3.6/native-$passthrough" \
              2>&1 | tee "$RUNNER_TEMP/md-terminal-results/native-3.6-$passthrough.log" || result=$?
          done
          exit "$result"

      - name: Check image pixels and interactions independently of native results
        id: images
        if: ${{ !cancelled() && env.IMAGES_REQUIRED == 'true' && steps.nvim.outcome == 'success' && steps.kitty.outcome == 'success' && steps.tmux36.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          KITTY_BIN: ${{ steps.kitty.outputs.bin }}
          TMUX_BIN: ${{ steps.tmux36.outputs.bin }}
        run: |
          set -euo pipefail
          export PATH="$TMUX_BIN:$KITTY_BIN:$PATH"
          test "$(command -v tmux)" = "$TMUX_BIN/tmux"
          test "$(tmux -V)" = 'tmux 3.6'
          xvfb-run -a --server-args="-screen 0 2400x1800x24" \
            python3 tests/tmux_terminal_test.py --images --passthrough all \
            --output "$RUNNER_TEMP/md-terminal-results/tmux-3.6/images" \
            2>&1 | tee "$RUNNER_TEMP/md-terminal-results/images.log"

      - name: Require every planned check
        id: result
        if: always()
        shell: bash
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          required=(checkout diagnostics nvim dependencies kitty direct tmux36 native36)
          if [ "$TMUX34_REQUIRED" = true ]; then required+=(tmux34 native34); fi
          if [ "$IMAGES_REQUIRED" = true ]; then required+=(images); fi
          python3 .github/ci/check-results.py "${required[@]}"

      - name: Keep terminal diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-kitty-${{ matrix.kitty }}-nvim-${{ matrix.nvim }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/md-terminal-results
            ${{ runner.temp }}/md-render-neovim-results
          retention-days: ${{ steps.result.outcome == 'success' && 14 || ((github.event_name == 'schedule' || inputs.suite == 'observation') && 90 || 30) }}
