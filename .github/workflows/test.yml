name: Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    name: nvim ${{ matrix.nvim }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # v0.12.0 is the minimum this plugin claims to support and is not the
        # same as stable: `vim.tty.request` only appeared in 0.13, and a probe
        # that depended on it silently disabled scaled headings on every 0.12.
        # Testing only `stable` hid that for an entire release.
        nvim: [v0.12.0, stable, nightly]
    runs-on: ${{ matrix.os }}
    # A broken nightly is Neovim's problem, not this repo's; keep it visible
    # without blocking merges.
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Report version
        run: nvim --version | head -1
      - name: Run tests
        run: make test

  snacks:
    name: Optional image backends / Fedora
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    env:
      MD_RENDER_SNACKS_PATH: /tmp/snacks.nvim
    steps:
      - name: Install runtime
        run: >-
          dnf install -y git neovim ImageMagick ffmpeg-free python3-gobject python3-cairo pango gobject-introspection
          google-noto-sans-mono-vf-fonts google-noto-sans-cjk-vf-fonts
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install latest Snacks
        run: git clone --depth=1 https://github.com/folke/snacks.nvim.git "$MD_RENDER_SNACKS_PATH"
      - name: Verify runtime
        run: |
          nvim --version
          magick --version
          ffmpeg -version
          git -C "$MD_RENDER_SNACKS_PATH" rev-parse HEAD
          rpm -q python3-gobject python3-cairo pango gobject-introspection google-noto-sans-mono-vf-fonts google-noto-sans-cjk-vf-fonts
      - name: Run heading integration tests
        run: |
          python3 tests/heading_raster_test.py
          nvim --headless -u NONE --noplugin -l tests/heading_typography_integration.lua
      - name: Run tooling integration tests with ImageMagick
        run: python3 tests/tooling_test.py
      - name: Run Snacks integration tests
        run: |
          for test in tests/snacks_*_test.lua tests/image_view_lifecycle_test.lua tests/picker_integration_test.lua; do
            nvim --headless -u NONE --noplugin -l "$test"
          done
