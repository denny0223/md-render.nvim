name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Baseline gates or weekly toolchain observation
        type: choice
        options: [baseline, observation]
        default: baseline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Core / nvim ${{ matrix.nvim }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        # The floor is distinct from stable; upstream drift belongs in observation.
        nvim: ${{ fromJSON((github.event_name == 'schedule' || inputs.suite == 'observation') && '["v0.12.0", "stable", "nightly"]' || '["v0.12.0", "v0.12.5"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      MD_RENDER_REQUIRE_NPM_PROBES: "1"
      MD_RENDER_CI_RESULTS: /tmp/md-core-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          persist-credentials: false
      - name: Install representative Node runtime
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Cache verified fixed Neovim archives
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && matrix.nvim != 'stable' && matrix.nvim != 'nightly' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/md-render-cache/neovim
          key: neovim-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.nvim }}-${{ hashFiles('.github/ci/neovim-archives.tsv') }}
      - name: Install verified Neovim
        id: neovim
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-neovim.sh '${{ matrix.nvim }}'
      - name: Record and verify runtime
        id: runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p "$MD_RENDER_CI_RESULTS"
          {
            uname -a
            for tool in nvim node npm python3 make; do command -v "$tool"; done
            nvim --version
            node --version
            npm --version
            python3 --version
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/runtime.log"
      - name: Run all independent core tests
        id: core
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$MD_RENDER_CI_RESULTS"
          make -k test 2>&1 | tee "$MD_RENDER_CI_RESULTS/core.log"
      - name: Run notification policy unit tests
        id: notification
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: node tests/ci_notify_test.js 2>&1 | tee "$MD_RENDER_CI_RESULTS/notification.log"
      - name: Summarize required phases
        id: phases
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const steps = JSON.parse(process.env.STEP_RESULTS);
            const rows = ['checkout', 'node', 'neovim', 'runtime', 'core', 'notification'].map(name => [name, steps[name]?.outcome || 'not run']);
            await core.summary.addHeading('Core phases').addTable([
              [{data: 'Phase', header: true}, {data: 'Original outcome', header: true}], ...rows,
            ]).write();
            core.setOutput('failed', rows.filter(([, outcome]) => outcome !== 'success').map(([name]) => name).join(',') || 'none');
      - name: Require original phases / ${{ steps.phases.outputs.failed || 'summary incomplete' }}
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.phases.outcome }}
          FAILED_PHASES: ${{ steps.phases.outputs.failed }}
        run: |
          test "$SUMMARY_OUTCOME" = success
          test "$FAILED_PHASES" = none
      - name: Keep core diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.os }}-${{ matrix.nvim }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.MD_RENDER_CI_RESULTS }}
            ${{ runner.temp }}/md-render-neovim-results
          retention-days: ${{ job.status != 'success' && ((github.event_name == 'schedule' || inputs.suite == 'observation') && 90 || 30) || 14 }}

  snacks:
    name: Released Fedora / image integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Fedora 44 rootfs is fixed; official RPM updates are intentionally followed.
    container: registry.fedoraproject.org/fedora:44@sha256:8ade22c0f76f6b2f0892290b1fb39fa1bda1566ba6e276a2ed427f45589c159b
    defaults:
      run:
        shell: bash
    env:
      MD_RENDER_SNACKS_PATH: /tmp/snacks.nvim
      MD_RENDER_REQUIRE_PLANTUML: "1"
      MD_RENDER_CI_RESULTS: /tmp/md-fedora-results
    steps:
      - name: Install image runtime from official RPM repositories
        id: install
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$MD_RENDER_CI_RESULTS"
          dnf install -y git neovim perl ImageMagick ffmpeg-free plantuml python3-gobject python3-cairo pango gobject-introspection \
            google-noto-sans-mono-vf-fonts google-noto-sans-cjk-vf-fonts 2>&1 | tee "$MD_RENDER_CI_RESULTS/install.log"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - name: Install baseline or observed Snacks
        id: snacks
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        env:
          OBSERVATION: ${{ github.event_name == 'schedule' || inputs.suite == 'observation' }}
        run: |
          {
            git init "$MD_RENDER_SNACKS_PATH"
            git -C "$MD_RENDER_SNACKS_PATH" remote add origin https://github.com/folke/snacks.nvim.git
            revision=882c996cf28183f4d63640de0b4c02ec886d01f2
            if [ "$OBSERVATION" = true ]; then revision=HEAD; fi
            git -C "$MD_RENDER_SNACKS_PATH" fetch --depth=1 origin "$revision"
            git -C "$MD_RENDER_SNACKS_PATH" checkout --detach FETCH_HEAD
            git -C "$MD_RENDER_SNACKS_PATH" rev-parse HEAD
            test -f "$MD_RENDER_SNACKS_PATH/lua/snacks/init.lua"
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/snacks.log"
      - name: Record and verify image runtime
        id: runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          cp /etc/os-release "$MD_RENDER_CI_RESULTS/os-release"
          cp /etc/yum.repos.d/*.repo "$MD_RENDER_CI_RESULTS/"
          rpm -qa --qf '%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$MD_RENDER_CI_RESULTS/rpms.txt"
          {
            echo 'Image: registry.fedoraproject.org/fedora:44@sha256:8ade22c0f76f6b2f0892290b1fb39fa1bda1566ba6e276a2ed427f45589c159b'
            dnf repo list --enabled
            for tool in nvim python3 magick ffmpeg ffprobe plantuml; do command -v "$tool"; done
            nvim --version
            magick --version
            ffmpeg -version
            ffmpeg -buildconf
            ffmpeg -codecs
            python3 -c 'import gi, cairo; gi.require_version("Pango", "1.0"); gi.require_version("PangoCairo", "1.0"); from gi.repository import Pango, PangoCairo; print(Pango.version_string(), cairo.cairo_version_string())'
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/runtime.log"
      - name: Run heading raster integration
        id: raster
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: python3 tests/heading_raster_test.py 2>&1 | tee "$MD_RENDER_CI_RESULTS/raster.log"
      - name: Run heading typography integration
        id: typography
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/heading_typography_integration.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/typography.log"
      - name: Run tooling integration with ImageMagick
        id: tooling
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: python3 tests/tooling_test.py 2>&1 | tee "$MD_RENDER_CI_RESULTS/tooling.log"
      - name: Run media resource integration
        id: resources
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/media_resources_test.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/resources.log"
      - name: Run PlantUML security integration
        id: plantuml_security
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/plantuml_security_test.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/plantuml-security.log"
      - name: Run PlantUML graphics integration
        id: plantuml_graphics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/plantuml_kitty_test.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/plantuml-graphics.log"
      - name: Run all independent Snacks integrations
        id: integrations
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.snacks.outcome == 'success' }}
        continue-on-error: true
        run: |
          result=0
          for test in tests/snacks_*_test.lua tests/image_view_lifecycle_test.lua tests/picker_integration_test.lua; do
            nvim --headless -u NONE --noplugin -l "$test" 2>&1 | tee "$MD_RENDER_CI_RESULTS/$(basename "$test").log" || result=1
          done
          exit "$result"
      - name: Summarize required phases
        id: phases
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const steps = JSON.parse(process.env.STEP_RESULTS);
            const rows = ['install', 'checkout', 'snacks', 'runtime', 'raster', 'typography', 'tooling', 'resources', 'plantuml_security', 'plantuml_graphics', 'integrations'].map(name => [name, steps[name]?.outcome || 'not run']);
            await core.summary.addHeading('Released Fedora phases').addTable([
              [{data: 'Phase', header: true}, {data: 'Original outcome', header: true}], ...rows,
            ]).write();
            core.setOutput('failed', rows.filter(([, outcome]) => outcome !== 'success').map(([name]) => name).join(',') || 'none');
      - name: Require original phases / ${{ steps.phases.outputs.failed || 'summary incomplete' }}
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.phases.outcome }}
          FAILED_PHASES: ${{ steps.phases.outputs.failed }}
        run: |
          test "$SUMMARY_OUTCOME" = success
          test "$FAILED_PHASES" = none
      - name: Keep Fedora diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: released-fedora-attempt-${{ github.run_attempt }}
          path: ${{ env.MD_RENDER_CI_RESULTS }}
          retention-days: ${{ job.status != 'success' && ((github.event_name == 'schedule' || inputs.suite == 'observation') && 90 || 30) || 14 }}

  notify:
    name: Report weekly observation
    concurrency:
      group: ${{ github.workflow }}-observation-report
      queue: max
    needs: [test, snacks]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'observation')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/ci/notify.js')({
              github, context, core, needs: JSON.parse(process.env.CI_NEEDS), dryRun: false,
            });

  preview:
    name: Preview CI report
    needs: [test, snacks]
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/ci/notify.js')({
              github, context, core, needs: JSON.parse(process.env.CI_NEEDS),
            });
