name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      suite:
        description: Baseline gates or weekly toolchain observation
        type: choice
        options: [baseline, observation]
        default: baseline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Core / nvim ${{ matrix.nvim }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        # The floor is distinct from stable; upstream drift belongs in observation.
        nvim: ${{ fromJSON((github.event_name == 'schedule' || inputs.suite == 'observation') && '["v0.12.0", "stable", "nightly"]' || '["v0.12.0", "v0.12.5"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      MD_RENDER_REQUIRE_NPM_PROBES: "1"
      MD_RENDER_CI_RESULTS: /tmp/md-core-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          persist-credentials: false
      - name: Install representative Node runtime
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Cache verified fixed Neovim archives
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && matrix.nvim != 'stable' && matrix.nvim != 'nightly' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/md-render-cache/neovim
          key: neovim-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.nvim }}-${{ hashFiles('.github/ci/neovim-archives.tsv') }}
      - name: Install verified Neovim
        id: neovim
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-neovim.sh '${{ matrix.nvim }}'
      - name: Record and verify runtime
        id: runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir -p "$MD_RENDER_CI_RESULTS"
          {
            uname -a
            for tool in nvim node npm python3 make; do command -v "$tool"; done
            nvim --version
            node --version
            npm --version
            python3 --version
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/runtime.log"
      - name: Run all independent core tests
        id: core
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$MD_RENDER_CI_RESULTS"
          make -k test 2>&1 | tee "$MD_RENDER_CI_RESULTS/core.log"
      - name: Run notification policy unit tests
        id: notification
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: node tests/ci_notify_test.js 2>&1 | tee "$MD_RENDER_CI_RESULTS/notification.log"
      - name: Summarize required phases
        id: phases
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const steps = JSON.parse(process.env.STEP_RESULTS);
            const rows = ['checkout', 'node', 'neovim', 'runtime', 'core', 'notification'].map(name => [name, steps[name]?.outcome || 'not run']);
            await core.summary.addHeading('Core phases').addTable([
              [{data: 'Phase', header: true}, {data: 'Original outcome', header: true}], ...rows,
            ]).write();
            core.setOutput('failed', rows.filter(([, outcome]) => outcome !== 'success').map(([name]) => name).join(',') || 'none');
      - name: Require original phases / ${{ steps.phases.outputs.failed || 'summary incomplete' }}
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.phases.outcome }}
          FAILED_PHASES: ${{ steps.phases.outputs.failed }}
        run: |
          test "$SUMMARY_OUTCOME" = success
          test "$FAILED_PHASES" = none
      - name: Keep core diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ matrix.os }}-${{ matrix.nvim }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.MD_RENDER_CI_RESULTS }}
            ${{ runner.temp }}/md-render-neovim-results
          retention-days: ${{ job.status != 'success' && ((github.event_name == 'schedule' || inputs.suite == 'observation') && 90 || 30) || 14 }}

  snacks:
    name: Released Fedora / image integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Fedora 44 rootfs is fixed; official RPM updates are intentionally followed.
    container: registry.fedoraproject.org/fedora:44@sha256:8ade22c0f76f6b2f0892290b1fb39fa1bda1566ba6e276a2ed427f45589c159b
    defaults:
      run:
        shell: bash
    env:
      MD_RENDER_SNACKS_PATH: /tmp/snacks.nvim
      MD_RENDER_REQUIRE_PLANTUML: "1"
      MD_RENDER_CI_RESULTS: /tmp/md-fedora-results
    steps:
      - name: Install image runtime from official RPM repositories
        id: install
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$MD_RENDER_CI_RESULTS"
          dnf install -y git neovim perl ImageMagick ffmpeg-free plantuml python3-gobject python3-cairo pango gobject-introspection \
            google-noto-sans-mono-vf-fonts google-noto-sans-cjk-vf-fonts 2>&1 | tee "$MD_RENDER_CI_RESULTS/install.log"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - name: Install baseline or observed Snacks
        id: snacks
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        env:
          OBSERVATION: ${{ github.event_name == 'schedule' || inputs.suite == 'observation' }}
        run: |
          {
            git init "$MD_RENDER_SNACKS_PATH"
            git -C "$MD_RENDER_SNACKS_PATH" remote add origin https://github.com/folke/snacks.nvim.git
            revision=882c996cf28183f4d63640de0b4c02ec886d01f2
            if [ "$OBSERVATION" = true ]; then revision=HEAD; fi
            git -C "$MD_RENDER_SNACKS_PATH" fetch --depth=1 origin "$revision"
            git -C "$MD_RENDER_SNACKS_PATH" checkout --detach FETCH_HEAD
            git -C "$MD_RENDER_SNACKS_PATH" rev-parse HEAD
            test -f "$MD_RENDER_SNACKS_PATH/lua/snacks/init.lua"
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/snacks.log"
      - name: Record and verify image runtime
        id: runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          cp /etc/os-release "$MD_RENDER_CI_RESULTS/os-release"
          cp /etc/yum.repos.d/*.repo "$MD_RENDER_CI_RESULTS/"
          rpm -qa --qf '%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$MD_RENDER_CI_RESULTS/rpms.txt"
          {
            echo 'Image: registry.fedoraproject.org/fedora:44@sha256:8ade22c0f76f6b2f0892290b1fb39fa1bda1566ba6e276a2ed427f45589c159b'
            dnf repo list --enabled
            for tool in nvim python3 magick ffmpeg ffprobe plantuml; do command -v "$tool"; done
            nvim --version
            magick --version
            ffmpeg -version
            ffmpeg -buildconf
            ffmpeg -codecs
            python3 -c 'import gi, cairo; gi.require_version("Pango", "1.0"); gi.require_version("PangoCairo", "1.0"); from gi.repository import Pango, PangoCairo; print(Pango.version_string(), cairo.cairo_version_string())'
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/runtime.log"
      - name: Run heading raster integration
        id: raster
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: python3 tests/heading_raster_test.py 2>&1 | tee "$MD_RENDER_CI_RESULTS/raster.log"
      - name: Run heading typography integration
        id: typography
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/heading_typography_integration.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/typography.log"
      - name: Run tooling integration with ImageMagick
        id: tooling
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: python3 tests/tooling_test.py 2>&1 | tee "$MD_RENDER_CI_RESULTS/tooling.log"
      - name: Run media resource integration
        id: resources
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/media_resources_test.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/resources.log"
      - name: Run PlantUML security integration
        id: plantuml_security
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/plantuml_security_test.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/plantuml-security.log"
      - name: Run PlantUML graphics integration
        id: plantuml_graphics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/plantuml_kitty_test.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/plantuml-graphics.log"
      - name: Run all independent Snacks integrations
        id: integrations
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.snacks.outcome == 'success' }}
        continue-on-error: true
        run: |
          result=0
          for test in tests/snacks_*_test.lua tests/image_view_lifecycle_test.lua tests/picker_integration_test.lua; do
            nvim --headless -u NONE --noplugin -l "$test" 2>&1 | tee "$MD_RENDER_CI_RESULTS/$(basename "$test").log" || result=1
          done
          exit "$result"
      - name: Summarize required phases
        id: phases
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const steps = JSON.parse(process.env.STEP_RESULTS);
            const rows = ['install', 'checkout', 'snacks', 'runtime', 'raster', 'typography', 'tooling', 'resources', 'plantuml_security', 'plantuml_graphics', 'integrations'].map(name => [name, steps[name]?.outcome || 'not run']);
            await core.summary.addHeading('Released Fedora phases').addTable([
              [{data: 'Phase', header: true}, {data: 'Original outcome', header: true}], ...rows,
            ]).write();
            core.setOutput('failed', rows.filter(([, outcome]) => outcome !== 'success').map(([name]) => name).join(',') || 'none');
      - name: Require original phases / ${{ steps.phases.outputs.failed || 'summary incomplete' }}
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.phases.outcome }}
          FAILED_PHASES: ${{ steps.phases.outputs.failed }}
        run: |
          test "$SUMMARY_OUTCOME" = success
          test "$FAILED_PHASES" = none
      - name: Keep Fedora diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: released-fedora-attempt-${{ github.run_attempt }}
          path: ${{ env.MD_RENDER_CI_RESULTS }}
          retention-days: ${{ job.status != 'success' && ((github.event_name == 'schedule' || inputs.suite == 'observation') && 90 || 30) || 14 }}

  rawhide:
    name: Rawhide / official RPM userland
    if: ${{ github.event_name == 'schedule' || inputs.suite == 'observation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:rawhide
    defaults:
      run:
        shell: bash
    env:
      MD_RENDER_SNACKS_PATH: /tmp/snacks.nvim
      MD_RENDER_REQUIRE_NPM_PROBES: "1"
      MD_RENDER_REQUIRE_PLANTUML: "1"
      MD_RENDER_REQUIRE_MEDIA_TOOLS: "1"
      MD_RENDER_CI_RESULTS: /tmp/md-rawhide-results
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Install core runtime from official RPM repositories
        id: install_core
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$MD_RENDER_CI_RESULTS"
          dnf install -y git make neovim nodejs npm python3 perl curl-minimal util-linux 2>&1 | tee "$MD_RENDER_CI_RESULTS/install-core.log"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false
      - name: Install image runtime from official RPM repositories
        id: install_images
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          dnf install -y ImageMagick ffmpeg-free plantuml python3-gobject python3-cairo pango gobject-introspection \
            google-noto-sans-mono-vf-fonts google-noto-sans-cjk-vf-fonts 2>&1 | tee "$MD_RENDER_CI_RESULTS/install-images.log"
      - name: Install terminal runtime from official RPM repositories
        id: install_terminal
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          dnf install -y kitty tmux xorg-x11-server-Xvfb xauth mesa-dri-drivers python3-pillow 2>&1 | tee "$MD_RENDER_CI_RESULTS/install-terminal.log"
      - name: Install fixed baseline Snacks
        id: snacks
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          {
            git init "$MD_RENDER_SNACKS_PATH"
            git -C "$MD_RENDER_SNACKS_PATH" remote add origin https://github.com/folke/snacks.nvim.git
            git -C "$MD_RENDER_SNACKS_PATH" fetch --depth=1 origin 882c996cf28183f4d63640de0b4c02ec886d01f2
            git -C "$MD_RENDER_SNACKS_PATH" checkout --detach FETCH_HEAD
            git -C "$MD_RENDER_SNACKS_PATH" rev-parse HEAD
            test -f "$MD_RENDER_SNACKS_PATH/lua/snacks/init.lua"
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/snacks.log"
      - name: Record RPM provenance and verify core runtime
        id: runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          cp /etc/os-release "$MD_RENDER_CI_RESULTS/os-release"
          rpm -qa --qf '%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$MD_RENDER_CI_RESULTS/rpms.txt"
          {
            echo 'Image: registry.fedoraproject.org/fedora:rawhide'
            echo 'The actual pulled digest is in this job Initialize containers log.'
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            dnf repo info --enabled
            for tool in nvim node npm python3 make; do
              binary=$(command -v "$tool")
              printf '%s: %s\n' "$tool" "$binary"
              rpm -qf "$binary" "$(readlink -f "$binary")"
            done
            nvim --version
            node --version
            npm --version
            python3 --version
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/runtime.log"
          # Fedora 45 moved packaged definitions to /usr; retain local overrides too.
          repo_count=0
          for repo in /etc/yum.repos.d/*.repo /etc/distro.repos.d/*.repo /etc/dnf/repos.d/*.repo /usr/share/dnf5/repos.d/*.repo; do
            if [ -f "$repo" ]; then
              mkdir -p "$MD_RENDER_CI_RESULTS/repos$(dirname "$repo")"
              cp "$repo" "$MD_RENDER_CI_RESULTS/repos$repo"
              repo_count=$((repo_count + 1))
            fi
          done
          test "$repo_count" -gt 0
      - name: Verify image runtime
        id: image_runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: |
          {
            for tool in magick ffmpeg ffprobe plantuml; do command -v "$tool"; done
            magick --version
            ffmpeg -version
            ffmpeg -buildconf
            ffmpeg -codecs
            python3 -c 'import gi, cairo; gi.require_version("Pango", "1.0"); gi.require_version("PangoCairo", "1.0"); from gi.repository import Pango, PangoCairo; from PIL import Image; print(Pango.version_string(), cairo.cairo_version_string(), Image.__version__)'
            git -C "$MD_RENDER_SNACKS_PATH" rev-parse HEAD
            test -f "$MD_RENDER_SNACKS_PATH/lua/snacks/init.lua"
          } 2>&1 | tee "$MD_RENDER_CI_RESULTS/image-runtime.log"
      - name: Verify software Kitty startup and window capture
        id: terminal_runtime
        if: ${{ !cancelled() && steps.install_terminal.outcome == 'success' && steps.install_images.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          kitty --version | tee "$MD_RENDER_CI_RESULTS/kitty-version.log"
          tmux -V | tee "$MD_RENDER_CI_RESULTS/tmux-version.log"
          xvfb-run -a --server-args="-screen 0 2400x1800x24" bash -e -o pipefail <<'SH' 2>&1 | tee "$MD_RENDER_CI_RESULTS/terminal-runtime.log"
          socket="$MD_RENDER_CI_RESULTS/preflight.sock"
          kitty --config NONE -o linux_display_server=x11 -o allow_remote_control=yes \
            --listen-on "unix:$socket" sleep 30 > "$MD_RENDER_CI_RESULTS/preflight-kitty.log" 2>&1 &
          kitty_pid=$!
          trap 'kill "$kitty_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if kitty @ --to "unix:$socket" ls > "$MD_RENDER_CI_RESULTS/preflight-window.json" 2>/dev/null; then break; fi
            kill -0 "$kitty_pid"
            sleep .25
          done
          window=$(python3 -c 'import json, os; print(json.load(open(os.environ["MD_RENDER_CI_RESULTS"] + "/preflight-window.json"))[0]["platform_window_id"])')
          magick import -window "$window" "$MD_RENDER_CI_RESULTS/preflight.png"
          magick identify "$MD_RENDER_CI_RESULTS/preflight.png"
          SH
      - name: Run all independent core and optional backend tests
        id: core
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # chmod permission fixtures must run without root's DAC bypass.
          core_user=$(mktemp -d /tmp/md-rawhide-core.XXXXXX)
          trap 'rm -rf "$core_user"' EXIT
          chown nobody:nobody "$core_user"
          runuser -u nobody -- env \
            XDG_CONFIG_HOME="$core_user/config" XDG_CACHE_HOME="$core_user/cache" \
            XDG_DATA_HOME="$core_user/data" XDG_STATE_HOME="$core_user/state" \
            npm_config_cache="$core_user/npm" \
            bash -e -o pipefail -c 'id; test "$(id -u)" != 0; make -k test' \
            2>&1 | tee "$MD_RENDER_CI_RESULTS/core.log"
      - name: Run heading raster integration
        id: raster
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: python3 tests/heading_raster_test.py 2>&1 | tee "$MD_RENDER_CI_RESULTS/raster.log"
      - name: Run heading typography integration
        id: typography
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        run: nvim --headless -u NONE --noplugin -l tests/heading_typography_integration.lua 2>&1 | tee "$MD_RENDER_CI_RESULTS/typography.log"
      - name: Run direct Kitty acceptance
        id: direct
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install_terminal.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: python3 tests/terminal_test.py 2>&1 | tee "$MD_RENDER_CI_RESULTS/direct.log"
      - name: Run native tmux passthrough on
        id: native_on
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install_terminal.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          xvfb-run -a --server-args="-screen 0 2400x1800x24" python3 tests/tmux_terminal_test.py --passthrough on \
            --output-on-failure "$MD_RENDER_CI_RESULTS/native-on" 2>&1 | tee "$MD_RENDER_CI_RESULTS/native-on.log"
      - name: Run native tmux passthrough all
        id: native_all
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install_terminal.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          xvfb-run -a --server-args="-screen 0 2400x1800x24" python3 tests/tmux_terminal_test.py --passthrough all \
            --output-on-failure "$MD_RENDER_CI_RESULTS/native-all" 2>&1 | tee "$MD_RENDER_CI_RESULTS/native-all.log"
      - name: Run tmux image pixels and interactions
        id: images
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.install_terminal.outcome == 'success' && steps.install_images.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          xvfb-run -a --server-args="-screen 0 2400x1800x24" python3 tests/tmux_terminal_test.py --images --passthrough all \
            --output "$MD_RENDER_CI_RESULTS/images" 2>&1 | tee "$MD_RENDER_CI_RESULTS/images.log"
      - name: Summarize required phases
        id: phases
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        with:
          script: |
            const steps = JSON.parse(process.env.STEP_RESULTS);
            const rows = ['install_core', 'checkout', 'install_images', 'install_terminal', 'snacks', 'runtime', 'image_runtime', 'terminal_runtime', 'core', 'raster', 'typography', 'direct', 'native_on', 'native_all', 'images'].map(name => [name, steps[name]?.outcome || 'not run']);
            await core.summary.addHeading('Rawhide phases').addRaw('Official RPM userland under Xvfb/software GL; not desktop, GPU, kernel, SELinux, or full-codec FFmpeg acceptance.').addTable([
              [{data: 'Phase', header: true}, {data: 'Original outcome', header: true}], ...rows,
            ]).write();
            core.setOutput('failed', rows.filter(([, outcome]) => outcome !== 'success').map(([name]) => name).join(',') || 'none');
      - name: Require original phases / ${{ steps.phases.outputs.failed || 'summary incomplete' }}
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.phases.outcome }}
          FAILED_PHASES: ${{ steps.phases.outputs.failed }}
        run: |
          test "$SUMMARY_OUTCOME" = success
          test "$FAILED_PHASES" = none
      - name: Keep Rawhide diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rawhide-attempt-${{ github.run_attempt }}
          path: ${{ env.MD_RENDER_CI_RESULTS }}
          retention-days: ${{ job.status != 'success' && 90 || 14 }}

  notify:
    name: Report weekly observation
    needs: [test, snacks, rawhide]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'observation')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/ci/notify.js')({
              github, context, core, needs: JSON.parse(process.env.CI_NEEDS), dryRun: false,
            });

  preview:
    name: Preview CI report
    needs: [test, snacks, rawhide]
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            await require('./.github/ci/notify.js')({
              github, context, core, needs: JSON.parse(process.env.CI_NEEDS),
            });
